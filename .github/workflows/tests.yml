name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Vérifier les options
        run: sh check_script_options.sh
      - name: Lancer les tests
        run: sh check_tests.sh
